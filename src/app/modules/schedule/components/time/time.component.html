  <div class="row" *ngFor="let row of [0, 1]">
    <div
      class="col time"
      *ngFor="let time of times.slice(row * 8, (row + 1) * 8)"
      [ngClass]="{
        'time-off': !time.available && time.startTime,
        'time-available': time.available && time.startTime,
      }"
    >
      {{ time.startTime | time }}
    </div>
  </div>
