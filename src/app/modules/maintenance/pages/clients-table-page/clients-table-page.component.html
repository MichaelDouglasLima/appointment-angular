<div class="container text-center">
  <div class="display-6 my-2">Cadastro de Clientes:</div>

  <div class="border rounded shadow sm p-4">
    <div class="text-end">
      <a routerLink="/client-form" class="btn btn-primary" id="btnNovo">Novo</a>
    </div>

    <table class="table table-striped">
      <thead>
        <tr>
          <th scope="col">#</th>
          <th scope="col">Nome</th>
          <th scope="col">Telefone</th>
          <th scope="col">Data Nascimento</th>
          <th scope="col">Comentários</th>
          <th scope="col">Remover</th>
        </tr>
        <tr>
          <th scope="col"></th>
          <th scope="col">
            <div class="input-group mb-3">
              <input
                type="text"
                class="form-control"
                placeholder="Filtrar pelo nome"
                aria-label="Username filter"
                [(ngModel)]="nameFilter"
                (keyup)="filterName()"
              />
            </div>
          </th>
          <th scope="col"></th>
          <th scope="col"></th>
          <th scope="col"></th>
          <th scope="col"></th>
        </tr>
      </thead>

      <tbody>
        <tr *ngFor="let client of clientPage.content">
          <th scope="row">{{ client.id }}</th>
          <td>
            <a routerLink="/client-form/{{ client.id }}">{{ client.name }}</a>
          </td>
          <td>{{ client.phone }}</td>
          <td>{{ client.dateOfBirth | date: "dd/MM/yyyy" }}</td>
          <td>{{ client?.comments }}</td>
          <td>
            <img
              src="assets/svg/trash3-fill.svg"
              width="20"
              height="20"
              alt="remove"
              (click)="delete(client, modalConfirm)"
            />
          </td>
        </tr>
      </tbody>
    </table>

    <ngb-pagination
      class="d-flex justify-content-center"
      [collectionSize]="clientPage.numberOfElements"
      [(page)]="page"
      [boundaryLinks]="true"
      (pageChange)="pageChange()"
    >
    </ngb-pagination>
  </div>
</div>

<app-modal #modalConfirm [title]="'Deseja remover o cliente?'">
  <ng-container *ngIf="selectedClient">
    Nome: <span class="fw-bold me-1">{{ selectedClient.name }}</span>
  </ng-container>
</app-modal>
